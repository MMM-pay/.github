name: Scanner tests

on:
  push:
    branches: [main]
    paths: ["scanner/**", ".github/workflows/scanner-tests.yml"]
  pull_request:
    paths: ["scanner/**", ".github/workflows/scanner-tests.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s scanner -v
